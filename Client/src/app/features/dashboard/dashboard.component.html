<div class="dashboard">
  <div class="dashboard__header">
    <h1>Dashboard</h1>
    <p>{{ stats()?.scope || 'Overview of projects and tasks' }}</p>
  </div>

  @if (loading()) {
    <div class="dashboard__state">
      <app-spinner size="lg"></app-spinner>
      <span>Loading dashboard…</span>
    </div>
  }

  @if (!loading() && error()) {
    <div class="dashboard__state dashboard__state--error">
      <span>{{ error() }}</span>
      <button class="dashboard__retry" (click)="load()">Retry</button>
    </div>
  }

  @if (!loading() && !error() && stats(); as s) {
    <section class="dashboard__kpis">
      <app-kpi-card label="Projects" [value]="s.totalProjects" tone="primary"></app-kpi-card>
      <app-kpi-card label="Total Tasks" [value]="s.totalTasks" tone="neutral"></app-kpi-card>
      <app-kpi-card label="Completed" [value]="s.completedTasks" tone="success"></app-kpi-card>
      <app-kpi-card label="Pending" [value]="s.pendingTasks" tone="warning"></app-kpi-card>
      <app-kpi-card label="Upcoming Due" [value]="s.upcomingDueTasks" tone="danger"></app-kpi-card>
    </section>

    <section class="dashboard__grid">
      <app-stat-breakdown title="Tasks by Status" [rows]="statusRows()"></app-stat-breakdown>
      <app-stat-breakdown title="Tasks by Priority" [rows]="priorityRows()"></app-stat-breakdown>
      <app-completion-ring [completed]="s.completedTasks" [pending]="s.pendingTasks"></app-completion-ring>
      <app-upcoming-due-list [tasks]="upcoming()"></app-upcoming-due-list>
    </section>
  }
</div>
