<div class="login-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <h2>Login</h2>
    <input formControlName="email" placeholder="Email" type="email" />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <div class="hint">Enter a valid email</div>
    }
    <input formControlName="password" placeholder="Password" type="password" />
    @if (form.get('password')?.invalid && form.get('password')?.touched) {
      <div class="hint">Password is required</div>
    }
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <button type="submit" [disabled]="isLoading()">{{ isLoading() ? 'Signing in...' : 'Login' }}</button>
    <p class="link">Don't have an account? <a routerLink="/register">Register</a></p>
  </form>
</div>
