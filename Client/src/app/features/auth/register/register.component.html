<div class="register-container">
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <h2>Register</h2>
    <input formControlName="name" placeholder="Full name" />
    <input formControlName="email" placeholder="Email" type="email" />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <div class="hint">Enter a valid email</div>
    }
    <div class="password-field">
      <input formControlName="password" placeholder="Password" autocomplete="new-password" [type]="showPassword() ? 'text' : 'password'" />
      <app-password-toggle [visible]="showPassword()" (toggled)="showPassword.set(!showPassword())" />
    </div>
    <div class="password-field">
      <input formControlName="confirmPassword" placeholder="Confirm password" autocomplete="new-password" [type]="showConfirmPassword() ? 'text' : 'password'" />
      <app-password-toggle [visible]="showConfirmPassword()" (toggled)="showConfirmPassword.set(!showConfirmPassword())" />
    </div>
    @if (form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched) {
      <div class="hint">Passwords do not match</div>
    }
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <button type="submit" [disabled]="isLoading()">{{ isLoading() ? 'Creating account...' : 'Register' }}</button>
    <p class="link">Already have an account? <a routerLink="/login">Login</a></p>
  </form>
</div>
