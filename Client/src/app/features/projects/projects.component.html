<div class="projects">
  <div class="projects__header">
    <div>
      <h1>Projects</h1>
      <p>Browse and manage projects</p>
    </div>
    @if (canManage) {
      <app-btn variant="primary" (click)="openCreate()">New Project</app-btn>
    }
  </div>

  <app-search-sort-bar
    class="projects__toolbar"
    searchPlaceholder="Search projects by name…"
    [searchValue]="search()"
    [sortBy]="sortBy()"
    [sortOrder]="sortOrder()"
    [sortOptions]="sortOptions"
    (searchChange)="onSearch($event)"
    (sortChange)="onSortField($event)"
    (sortOrderChange)="onSortOrderChange($event)"
  ></app-search-sort-bar>

  @if (loading()) {
    <div class="projects__state">
      <app-spinner></app-spinner>
      <span>Loading projects…</span>
    </div>
  }

  @if (!loading() && error()) {
    <div class="projects__state projects__state--error">
      <span>{{ error() }}</span>
      <app-btn size="sm" variant="outline" (click)="load()">Retry</app-btn>
    </div>
  }

  @if (!loading() && !error()) {
    <app-project-table
      [projects]="projects()"
      [canManage]="canManage"
      [sortBy]="sortBy()"
      [sortOrder]="sortOrder()"
      (sortChange)="onSort($event)"
      (edit)="openEdit($event)"
      (delete)="remove($event)"
    ></app-project-table>

    <div class="projects__footer">
      <app-pagination
        [pageNumber]="pageNumber()"
        [pageSize]="pageSize"
        [totalCount]="totalCount()"
        [totalPages]="totalPages()"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    </div>
  }

  <app-project-modal
    [open]="modalOpen()"
    [project]="editing()"
    [saving]="saving()"
    [errorMessage]="modalError()"
    (close)="closeModal()"
    (save)="save($event)"
  ></app-project-modal>
</div>
