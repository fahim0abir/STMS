<aside class="shell__sidebar" [class.open]="sidebarOpen()">
  <div class="shell__brand">
    <a routerLink="/dashboard" class="shell__brand-link">SmartTask</a>
    <button class="shell__close" (click)="toggleSidebar()">&times;</button>
  </div>
  <nav class="shell__nav">
    <ul>
      <li *ngFor="let link of navLinks" [class.hidden]="!isLinkVisible(link.roles)">
        <a
          routerLink="{{ link.path }}"
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
          >{{ link.label }}</a
      >
      </li>
    </ul>
  </nav>
  <div class="shell__footer">
    <div *ngIf="currentUser()" class="shell__user">
      <span class="shell__user-name">{{ currentUser()?.name || currentUser()?.email }}</span>
      <app-badge variant="secondary" [label]="currentUser()?.role || ''"></app-badge>
    </div>
    <app-btn variant="ghost" (click)="logout()">Logout</app-btn>
  </div>
</aside>

<header class="shell__topbar">
  <button class="shell__menu" (click)="toggleSidebar()">&#9776;</button>
  <div class="shell__title">SmartTask</div>
  <div class="shell__actions">
    <app-badge variant="primary" [label]="(currentUser()?.role || '').toUpperCase()"></app-badge>
  </div>
</header>

<main class="shell__content">
  <router-outlet />
</main>
