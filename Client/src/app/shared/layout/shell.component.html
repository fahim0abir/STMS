<aside class="shell__sidebar" [class.open]="sidebarOpen()">
  <div class="shell__brand">
    <a routerLink="/dashboard" class="shell__brand-link" (click)="closeSidebar()">SmartTask</a>
    <button class="shell__close" (click)="toggleSidebar()">&times;</button>
  </div>
  <nav class="shell__nav">
    <ul>
      @for (link of navLinks; track link.path) {
        <li [class.hidden]="!isLinkVisible(link.roles)">
          <a
            [routerLink]="link.path"
            routerLinkActive="shell__nav-link--active"
            class="shell__nav-link"
            (click)="closeSidebar()"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>
  </nav>
  <div class="shell__footer">
    @if (currentUser(); as user) {
      <a [routerLink]="'/profile'" class="shell__user shell__user--link" title="Edit your profile" (click)="closeSidebar()">
        <span class="shell__user-name">{{ user.name || user.email }}</span>
        <app-badge variant="secondary" [label]="user.role || ''"></app-badge>
      </a>
    }
    <app-btn variant="danger" (click)="logout()">Logout</app-btn>
  </div>
</aside>

<header class="shell__topbar">
  <button class="shell__menu" (click)="toggleSidebar()">&#9776;</button>
  <div class="shell__title">SmartTask</div>
  <div class="shell__actions">
    <app-badge variant="primary" [label]="(currentUser()?.role || '').toUpperCase()"></app-badge>
  </div>
</header>

<main class="shell__content">
  <router-outlet />
</main>
