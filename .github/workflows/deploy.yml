name: Build .NET and Angular

on:
  push:
    branches: [deploy]

jobs:
  build-and-pack:
    runs-on: self-hosted # Targets your local self-hosted runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Angular Dependencies & Build
        working-directory: ./Client
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET Dependencies
        run: dotnet restore ./Server/SmartTask.API/SmartTask.API.csproj

      - name: Inject JWT Secret into appsettings.json
        shell: powershell
        env:
          JWT_KEY_SECRET: ${{ secrets.JWT_KEY }}
        run: |
          $filePath = "./Server/SmartTask.API/appsettings.json"

          # Read existing appsettings.json
          $json = Get-Content $filePath -Raw | ConvertFrom-Json

          # Ensure the 'Jwt' section exists
          if (-not $json.PSObject.Properties['Jwt']) {
              $json | Add-Member -NotePropertyName 'Jwt' -NotePropertyValue ([PSCustomObject]@{});
          }

          # Inject or update the Key property securely from the GitHub secret
          $json.Jwt | Add-Member -NotePropertyName 'Key' -NotePropertyValue $env:JWT_KEY_SECRET -Force

          # Save back to appsettings.json
          $json | ConvertTo-Json -Depth 10 | Set-Content $filePath

      - name: Build .NET Project
        run: dotnet build ./Server/SmartTask.API/SmartTask.API.csproj --configuration Release --no-restore

      - name: Publish .NET Project
        run: dotnet publish ./Server/SmartTask.API/SmartTask.API.csproj --configuration Release --output C:/inetpub/STMS.Server --no-build

      - name: Copy Angular Build into iis
        shell: powershell
        run: |
          Remove-Item -Recurse -Force C:/inetpub/STMS.Client/*
          Copy-Item -Recurse -Force ./Client/dist/smart-task-ui/* C:/inetpub/STMS.Client/
