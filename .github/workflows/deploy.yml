name: Build .NET and Angular

on:
  push:
    branches: [deploy]

jobs:
  build-and-pack:
    runs-on: self-hosted # Targets your local self-hosted runner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Angular Dependencies & Build
        working-directory: ./Client
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET Dependencies
        run: dotnet restore ./Server/SmartTask.API/SmartTask.API.csproj

      - name: Inject JWT Secret into appsettings.prod.json
        shell: powershell
        env:
          ConnectionStrings_DefaultConnection: ${{ secrets.ConnectionStrings_DefaultConnection }}
          JWT_KEY_SECRET: ${{ secrets.JWT_KEY }}
          JWT_Issuer: "SmartTask"
          JWT_Audience: "SmartTaskClients"
          AI_GITHUB_MODELS_API_KEY: ${{ secrets.AI_GITHUB_MODELS_API_KEY }}
          AI__GOOGLEAISTUDIO__APIKEY: ${{ secrets.AI__GOOGLEAISTUDIO__APIKEY }}
          CORS_ALLOWED_ORIGINS: '["http://144.79.249.252:8021", "https://144.79.249.252:8021"]'
        run: |
          $filePath = "./Server/SmartTask.API/appsettings.json"

          # Ensure the target directory exists
          $dir = Split-Path -Parent $filePath
          if (-not (Test-Path $dir)) {
              New-Item -ItemType Directory -Path $dir -Force | Out-Null
          }

          # Load existing appsettings.json or create a new empty object if it doesn't exist
          if (Test-Path $filePath) {
              $json = Get-Content $filePath -Raw | ConvertFrom-Json
          } else {
              $json = [PSCustomObject]@{}
          }

          # Inject or update the DefaultConnection string securely from the GitHub secret
          if (-not $json.PSObject.Properties['ConnectionStrings']) {  
              $json | Add-Member -NotePropertyName 'ConnectionStrings' -NotePropertyValue ([PSCustomObject]@{});
          }

          $json.ConnectionStrings | Add-Member -NotePropertyName 'DefaultConnection' -NotePropertyValue $env:ConnectionStrings_DefaultConnection -Force

          # Ensure the 'Jwt' section exists
          if (-not $json.PSObject.Properties['Jwt']) {
              $json | Add-Member -NotePropertyName 'Jwt' -NotePropertyValue ([PSCustomObject]@{});
          }

          # Inject or update the Key property securely from the GitHub secret
          $json.Jwt | Add-Member -NotePropertyName 'Key' -NotePropertyValue $env:JWT_KEY_SECRET -Force
          $json.Jwt | Add-Member -NotePropertyName 'Issuer' -NotePropertyValue $env:JWT_Issuer -Force
          $json.Jwt | Add-Member -NotePropertyName 'Audience' -NotePropertyValue $env:JWT_Audience -Force

          # Ensure the 'AI' section exists
          if (-not $json.PSObject.Properties['AI']) {
              $json | Add-Member -NotePropertyName 'AI' -NotePropertyValue ([PSCustomObject]@{});
          }

          # Ensure the 'GoogleAIStudio' section exists
          if (-not $json.AI.PSObject.Properties['GoogleAIStudio']) {
              $json.AI | Add-Member -NotePropertyName 'GoogleAIStudio' -NotePropertyValue ([PSCustomObject]@{});
          }

          # Inject or update the ApiKey property securely from the GitHub secret
          $json.AI.GoogleAIStudio | Add-Member -NotePropertyName 'ApiKey' -NotePropertyValue $env:AI__GOOGLEAISTUDIO__APIKEY -Force

          # Ensure the 'CORS' section exists
          if (-not $json.PSObject.Properties['CORS']) {
              $json | Add-Member -NotePropertyName 'CORS' -NotePropertyValue ([PSCustomObject]@{});
          }

          # Ensure the 'AllowedOrigins' property exists within the 'CORS' section
          if (-not $json.CORS.PSObject.Properties['AllowedOrigins']) {
              $json.CORS | Add-Member -NotePropertyName 'AllowedOrigins' -NotePropertyValue @() -Force
          }

          # Convert the JSON environment variable string into a native PowerShell string array (list of strings)
          $allowedOriginsList = @($env:CORS_ALLOWED_ORIGINS | ConvertFrom-Json)

          # Inject or update the AllowedOrigins property securely from the GitHub secret
          $json.CORS | Add-Member -NotePropertyName 'AllowedOrigins' -NotePropertyValue $allowedOriginsList:value -Force

          # Save back to appsettings.json
          $json | ConvertTo-Json -Depth 10 | Set-Content $filePath

      - name: Build .NET Project
        run: dotnet build ./Server/SmartTask.API/SmartTask.API.csproj --configuration Release --no-restore

      - name: Publish and Deploy to IIS with Auto-Recovery
        shell: powershell
        run: |
          Import-Module WebAdministration
          $siteName = "STMS.Server"     # Update if your IIS site name differs
          $appPoolName = "STMS.Server"  # Update if your IIS app pool name differs

          try {
              Write-Host "=== Stopping IIS Website and App Pool ==="
              Stop-WebSite -Name $siteName -ErrorAction SilentlyContinue
              Stop-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
              
              # Allow w3wp.exe time to fully release file locks
              Start-Sleep -Seconds 3

              Write-Host "=== Publishing .NET Backend ==="
              dotnet publish ./Server/SmartTask.API/SmartTask.API.csproj --configuration Release --output C:/inetpub/STMS.Server --no-build
              if ($LASTEXITCODE -ne 0) { throw "Dotnet publish failed." }

              Write-Host "=== Deploying Angular Frontend ==="
              Remove-Item -Recurse -Force C:/inetpub/STMS.Client/* -ErrorAction SilentlyContinue
              Copy-Item -Recurse -Force ./Client/dist/smart-task-ui/browser/* C:/inetpub/STMS.Client/
          }
          catch {
              Write-Error "Deployment pipeline failed: $_"
              throw $_
          }
          finally {
              Write-Host "=== Restarting IIS App Pool and Website ==="
              Start-WebAppPool -Name $appPoolName -ErrorAction SilentlyContinue
              Start-WebSite -Name $siteName -ErrorAction SilentlyContinue
          }
